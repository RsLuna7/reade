name: Deploy Reade Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# D01：顶层只保留 contents: read；pages 发布权限只授予 deploy 作业。
# 发布（build + deploy）必须依赖同一提交通过 verify.yml 门禁。
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (publish gate)
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  build:
    name: Build static site
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Reade Web
        env:
          READE_CONTENT_DIR: examples/demo-library
          READE_SITE_TITLE: Reade
        run: pnpm build:web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
