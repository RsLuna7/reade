<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reade · 品牌伴读球</title>
  <style>
    :root {
      --paper: #fffefa;
      --chrome: #f3efe6;
      --chrome-strong: #ebe5d8;
      --ink: #202729;
      --muted: #8b9290;
      --line: rgba(55, 62, 61, 0.12);
      --accent: #af4c38;
      --accent-ink: #873727;
      --eye: #fff6ea;
      --ease: cubic-bezier(0.23, 1, 0.32, 1);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 28rem),
        var(--paper);
      font: 15px/1.5 "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    .page {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100dvh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background:
        radial-gradient(circle at 28px 36px, color-mix(in srgb, var(--accent) 12%, transparent), transparent 110px),
        var(--chrome);
    }

    .sidebar-header { padding: 25px 20px 17px; }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 38px;
    }

    .brand-copy p { margin: 0; }
    .brand-name {
      font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .brand-tagline {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .sidebar-note {
      margin: 18px 20px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .stage {
      padding: 36px 44px 56px;
    }

    h1 {
      margin: 0 0 8px;
      font-family: Georgia, "Noto Serif SC", serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .lede {
      max-width: 46rem;
      margin: 0 0 28px;
      color: color-mix(in srgb, var(--ink) 72%, var(--muted));
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      max-width: 920px;
    }

    .card {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      padding: 16px 16px 16px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: color-mix(in srgb, var(--paper) 82%, white);
      text-align: left;
      cursor: pointer;
      color: inherit;
      font: inherit;
      transition: border-color 160ms var(--ease), transform 160ms var(--ease), background 160ms var(--ease);
    }
    .card:hover { transform: translateY(-1px); }
    .card:active { transform: scale(0.985); }
    .card[aria-pressed="true"] {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      background: color-mix(in srgb, var(--accent) 7%, var(--paper));
    }

    .specimen {
      display: grid;
      width: 72px;
      height: 72px;
      place-items: center;
    }

    .card h2 {
      margin: 0 0 4px;
      font-family: Georgia, "Noto Serif SC", serif;
      font-size: 17px;
    }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    .pick {
      display: none;
      margin-top: 8px;
      color: var(--accent-ink);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .card[aria-pressed="true"] .pick { display: block; }

    .hint {
      max-width: 920px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .face {
      display: block;
      overflow: visible;
    }
    .face-in-header { width: 35px; height: 35px; }
    .face-in-card { width: 56px; height: 56px; }

    .body-fill { fill: var(--accent); }
    .eye-fill { fill: var(--eye); }
    .mark-letter {
      fill: #fffaf0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      font-weight: 700;
    }

    .eyes {
      transform-box: fill-box;
      transform-origin: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
    }

    @media (max-width: 860px) {
      .page { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .grid { grid-template-columns: 1fr; }
      .stage { padding: 24px 20px 40px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="brand">
          <div id="header-slot" aria-hidden="true"></div>
          <div class="brand-copy">
            <p class="brand-name">Reade</p>
            <p class="brand-tagline">Local Reader</p>
          </div>
        </div>
      </header>
      <p class="sidebar-note">
        左上角就是真实尺寸：35×35。移动鼠标，看哪一版在这么小的格子里仍然「在看你」。
      </p>
    </aside>

    <main class="stage">
      <h1>挑一颗属于 Reade 的眼</h1>
      <p class="lede">
        不直接搬 Grok 的黑blob。下面四版共用同一套视线弹簧和眨眼，只换形体。
        点一张卡片，左上角会换成那一版。
      </p>

      <div class="grid" id="grid"></div>
      <p class="hint">点击卡片选中 · 眨眼是随机的 · 系统开了「减少动态效果」时会停住视线。</p>
    </main>
  </div>

  <script>
    const REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const FACES = [
      {
        id: "dogear",
        title: "折角",
        blurb: "沿用现在的品牌剪影：圆角方块、左下折角。眼睛取代字母 R。最像「原来的图标活了」。",
        svg: `
          <path class="body-fill" d="M10 0h15a10 10 0 0 1 10 10v15a10 10 0 0 1-10 10H3.2C1.2 35 0 33.8 0 31.8V10A10 10 0 0 1 10 0z"/>
          <g class="eyes" data-eyes>
            <ellipse class="eye-fill" cx="12.4" cy="16.2" rx="4.1" ry="5.15"/>
            <ellipse class="eye-fill" cx="22.6" cy="16.2" rx="4.1" ry="5.15"/>
          </g>`
      },
      {
        id: "clay",
        title: "陶土",
        blurb: "最接近你喜欢的 Grok 球：软边、略扁、两只大眼。颜色换成 Reade 陶土，避免整颗黑圆。",
        svg: `
          <path class="body-fill" d="M17.6 1.1c7.6 0 15.2 5.2 16.1 14.1 0.7 7.2-4.3 16.4-15.6 18.2C7.6 35.1 1.2 28.4 1.05 18.6 0.9 9.2 9.4 1.1 17.6 1.1z"/>
          <g class="eyes" data-eyes>
            <ellipse class="eye-fill" cx="12.2" cy="16.6" rx="4.35" ry="5.4"/>
            <ellipse class="eye-fill" cx="22.9" cy="16.6" rx="4.35" ry="5.4"/>
          </g>`
      },
      {
        id: "ribbon",
        title: "书签",
        blurb: "书签形：上圆下尖。阅读器自己的物件，不是通用吉祥物。小尺寸下轮廓仍然可认。",
        svg: `
          <path class="body-fill" d="M17.5 1.2c8.1 0 14.6 6.2 14.6 14.2 0 6.4-4.4 12.2-10.4 18.1L17.5 38.2 13.3 33.5C7.3 27.6 2.9 21.8 2.9 15.4 2.9 7.4 9.4 1.2 17.5 1.2z"/>
          <g class="eyes" data-eyes>
            <ellipse class="eye-fill" cx="12.6" cy="15.4" rx="4.05" ry="5.05"/>
            <ellipse class="eye-fill" cx="22.4" cy="15.4" rx="4.05" ry="5.05"/>
          </g>`
      },
      {
        id: "seal",
        title: "蜡印",
        blurb: "正圆蜡印。最安静、也最不像 Grok。代价是 35px 时个性最弱，更像一颗纽扣。",
        svg: `
          <circle class="body-fill" cx="17.5" cy="17.5" r="16.4"/>
          <g class="eyes" data-eyes>
            <ellipse class="eye-fill" cx="12.3" cy="17.2" rx="4.2" ry="5.25"/>
            <ellipse class="eye-fill" cx="22.7" cy="17.2" rx="4.2" ry="5.25"/>
          </g>`
      }
    ];

    const MARK = `
      <rect class="body-fill" x="0" y="0" width="35" height="35" rx="10"/>
      <path class="body-fill" d="M0 25h3.2V35H0z"/>
      <text class="mark-letter" x="17.5" y="23" text-anchor="middle">R</text>
      <rect fill="rgba(255,255,255,0.75)" x="21" y="26.5" width="9" height="1"/>
      <rect fill="rgba(255,255,255,0.55)" x="21" y="23.5" width="9" height="1"/>`;

    let selected = "dogear";
    const faces = [];

    function svgFor(face, sizeClass) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", `face ${sizeClass}`);
      svg.setAttribute("viewBox", "0 0 35 35");
      svg.setAttribute("aria-hidden", "true");
      svg.innerHTML = face.svg;
      return svg;
    }

    function mountHeader() {
      const slot = document.getElementById("header-slot");
      slot.replaceChildren();
      const face = FACES.find((item) => item.id === selected);
      const node = svgFor(face, "face-in-header");
      slot.append(node);
      faces.push({ el: node, eyes: node.querySelector("[data-eyes]") });
    }

    function renderGrid() {
      const grid = document.getElementById("grid");
      for (const face of FACES) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "card";
        button.dataset.id = face.id;
        button.setAttribute("aria-pressed", face.id === selected ? "true" : "false");
        button.innerHTML = `
          <div class="specimen"></div>
          <div>
            <h2>${face.title}</h2>
            <p>${face.blurb}</p>
            <span class="pick">用于左上角</span>
          </div>`;
        const specimen = button.querySelector(".specimen");
        const node = svgFor(face, "face-in-card");
        specimen.append(node);
        faces.push({ el: node, eyes: node.querySelector("[data-eyes]") });
        button.addEventListener("click", () => select(face.id));
        grid.append(button);
      }
    }

    function select(id) {
      selected = id;
      for (const card of document.querySelectorAll(".card")) {
        card.setAttribute("aria-pressed", card.dataset.id === id ? "true" : "false");
      }
      faces.length = 0;
      document.querySelectorAll(".face-in-card").forEach((node) => {
        faces.push({ el: node, eyes: node.querySelector("[data-eyes]") });
      });
      mountHeader();
    }

    const pointer = { x: window.innerWidth * 0.62, y: window.innerHeight * 0.42 };
    const gaze = new Map();

    window.addEventListener("pointermove", (event) => {
      pointer.x = event.clientX;
      pointer.y = event.clientY;
    }, { passive: true });

    function springToward(state, target, dt) {
      const stiffness = 46;
      const damping = 14;
      state.vx += (target.x - state.x) * stiffness * dt;
      state.vy += (target.y - state.y) * stiffness * dt;
      state.vx *= Math.exp(-damping * dt);
      state.vy *= Math.exp(-damping * dt);
      state.x += state.vx * dt;
      state.y += state.vy * dt;
    }

    let blinkUntil = 0;
    let nextBlink = performance.now() + 1800;

    function tick(now) {
      const dt = Math.min(0.032, (tick.prev ? now - tick.prev : 16) / 1000);
      tick.prev = now;

      if (!REDUCE && now >= nextBlink) {
        blinkUntil = now + 90;
        nextBlink = now + 2800 + Math.random() * 4200;
      }

      for (const face of faces) {
        if (!gaze.has(face.el)) gaze.set(face.el, { x: 0, y: 0, vx: 0, vy: 0 });
        const state = gaze.get(face.el);
        const box = face.el.getBoundingClientRect();
        const cx = box.left + box.width / 2;
        const cy = box.top + box.height / 2;
        const nx = Math.max(-1, Math.min(1, (pointer.x - cx) / 220));
        const ny = Math.max(-1, Math.min(1, (pointer.y - cy) / 180));
        if (REDUCE) {
          state.x = 0;
          state.y = 0;
        } else {
          springToward(state, { x: nx, y: ny }, dt);
        }
        const px = state.x * 3.1;
        const py = state.y * 2.2;
        const blinking = now < blinkUntil;
        face.eyes.style.transform = `translate(${px}px, ${py}px) scale(1, ${blinking ? 0.12 : 1})`;
      }
      requestAnimationFrame(tick);
    }

    renderGrid();
    mountHeader();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
